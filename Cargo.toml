[package]
name = "notify-send-win"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The Linux notify-send command for Windows: show desktop notifications from the command line"
license = "MIT"
repository = "https://github.com/metinata/notify-send"
readme = "README.md"
keywords = ["notify-send", "notification", "toast", "cli", "windows"]
categories = ["command-line-utilities", "os::windows-apis"]
include = [
    "/assets",
    "/src",
    "/tests",
    "/build.rs",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/THIRD-PARTY-NOTICES.md",
]

[[bin]]
name = "notify-send"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.31"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
